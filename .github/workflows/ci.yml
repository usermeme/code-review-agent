name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Workspace
        run: pnpm run lint

      - name: Typecheck Workspace
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm run test

      - name: Run E2E Tests (BDD / Cucumber)
        run: pnpm run e2e

      - name: Build All Artifacts
        run: pnpm run build

  docker-dry-run:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        include:
          - app: gateway
            file: apps/gateway/Dockerfile
          - app: agent-context-builder
            file: apps/agent-context-builder/Dockerfile
          - app: agent-code-reviewer
            file: apps/agent-code-reviewer/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.app }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: code-review-agent-${{ matrix.app }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
