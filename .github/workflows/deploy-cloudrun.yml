name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Google Cloud Region'
        required: true
        default: 'us-central1'
  workflow_run:
    workflows: ['Release Containers']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Services to Cloud Run
    runs-on: ubuntu-latest
    # Only run if triggered manually or if Release Containers succeeded, and GCP secrets are configured
    if: >
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      secrets.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != ''
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Provision / Verify GCP Infrastructure
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
          PUBSUB_SECRET_TOKEN: ${{ secrets.PUBSUB_SECRET_TOKEN }}
        run: |
          chmod +x scripts/setup-gcp-infra.sh
          bash scripts/setup-gcp-infra.sh

      - name: Deploy Gateway Service
        id: deploy-gateway
        env:
          REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy gateway-service \
            --image "ghcr.io/${{ github.repository_owner }}/code-review-agent-gateway:latest" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "APP_NAME=gateway,PORT=8080,HOST=0.0.0.0,BUILD_CONTEXT_TOPIC=build-context-topic,CONTEXT_READY_TOPIC=context-ready-topic,REVIEW_CODE_TOPIC=review-code-topic,REVIEW_RESULT_TOPIC=review-result-topic,GIT_ADAPTER=github,GIT_ADAPTER_WEBHOOK_SECRET=${{ secrets.GIT_ADAPTER_WEBHOOK_SECRET }},GIT_ADAPTER_TOKEN=${{ secrets.GIT_ADAPTER_TOKEN }},PUBSUB_SECRET_TOKEN=${{ secrets.PUBSUB_SECRET_TOKEN }}"

          GATEWAY_URL=$(gcloud run services describe gateway-service --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          echo "GATEWAY_URL=$GATEWAY_URL" >> $GITHUB_ENV
          echo "Deployed Gateway at: $GATEWAY_URL"

      - name: Deploy Context Builder Agent
        env:
          REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy agent-context-builder \
            --image "ghcr.io/${{ github.repository_owner }}/code-review-agent-context-builder:latest" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --no-allow-unauthenticated \
            --set-env-vars "GATEWAY_URL=$GATEWAY_URL,REVIEW_MODEL=${{ vars.REVIEW_MODEL || 'gemini-2.5-flash' }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GOOGLE_GENAI_USE_VERTEXAI=0"

      - name: Deploy Code Reviewer Agent
        env:
          REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy agent-code-reviewer \
            --image "ghcr.io/${{ github.repository_owner }}/code-review-agent-code-reviewer:latest" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --no-allow-unauthenticated \
            --set-env-vars "GATEWAY_URL=$GATEWAY_URL,REVIEW_MODEL=${{ vars.REVIEW_MODEL || 'gemini-2.5-flash' }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GOOGLE_GENAI_USE_VERTEXAI=0"

      - name: Wire Pub/Sub Push Subscriptions to Gateway
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
          PUBSUB_SECRET_TOKEN: ${{ secrets.PUBSUB_SECRET_TOKEN }}
        run: |
          bash scripts/setup-gcp-infra.sh
          echo "All services deployed and subscriptions wired successfully."
