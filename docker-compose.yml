version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: apps/github-gateway/Dockerfile
    ports:
      - '3000:8080'
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GITHUB_WEBHOOK_SECRET=local-webhook-secret
      - GITHUB_TOKEN=dummy-token
      - PR_EVENTS_TOPIC=pr-events
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-project
    depends_on:
      - core
      - pubsub-emulator

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    ports:
      - '3001:8080'
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-project
      - REVIEW_RESULTS_TOPIC=review-results
      - REVIEW_MODEL=gemini-3.8-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-key}
      - GITHUB_TOKEN=dummy-token
    depends_on:
      - firestore-emulator
      - pubsub-emulator

  firestore-emulator:
    image: google/cloud-sdk:emulators
    ports:
      - '8081:8080'
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    ports:
      - '8085:8085'
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-project

  pubsub-init:
    image: google/cloud-sdk:emulators
    depends_on:
      - pubsub-emulator
    entrypoint: >
      bash -c "
        echo 'Waiting for PubSub emulator...';
        while ! curl -s http://pubsub-emulator:8085 > /dev/null; do sleep 1; done;
        echo 'Creating PubSub topics...';
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/pr-events;
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/review-results;
        echo 'Creating PubSub push subscriptions...';
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/pr-events-sub \
          -H 'Content-Type: application/json' \
          -d '{\"topic\":\"projects/local-project/topics/pr-events\",\"pushConfig\":{\"pushEndpoint\":\"http://core:8080/api/v1/pubsub/pr-events\"}}';
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/review-results-sub \
          -H 'Content-Type: application/json' \
          -d '{\"topic\":\"projects/local-project/topics/review-results\",\"pushConfig\":{\"pushEndpoint\":\"http://gateway:8080/api/v1/pubsub/review-results\"}}';
        echo 'PubSub emulator initialized successfully with push endpoints.';
      "
