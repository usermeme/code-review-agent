version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: apps/github-gateway/Dockerfile
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - CORE_URL=http://core:8080
      - GIT_ADAPTER=github
      - GIT_ADAPTER_WEBHOOK_SECRET=local-webhook-secret
      - GIT_ADAPTER_TOKEN=dummy-token
      - PUBSUB_SECRET_TOKEN=local-internal-secret
    depends_on:
      - core

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    ports:
      - "3001:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GATEWAY_URL=http://gateway:8080
      - PUBSUB_SECRET_TOKEN=local-internal-secret
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-project
      - BUILD_CONTEXT_TOPIC=build-context-topic
      - REVIEW_CODE_TOPIC=review-code-topic
    depends_on:
      - firestore-emulator
      - pubsub-emulator

  agent-context-builder:
    build:
      context: .
      dockerfile: apps/agent-context-builder/Dockerfile
    ports:
      - "8001:8080"
    environment:
      - PORT=8080
      - CORE_URL=http://core:8080
      - REVIEW_MODEL=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-key}
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-project
      - CONTEXT_READY_TOPIC=context-ready-topic
    depends_on:
      - core
      - pubsub-emulator

  agent-code-reviewer:
    build:
      context: .
      dockerfile: apps/agent-code-reviewer/Dockerfile
    ports:
      - "8002:8080"
    environment:
      - PORT=8080
      - CORE_URL=http://core:8080
      - REVIEW_MODEL=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-key}
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-project
      - REVIEW_RESULT_TOPIC=review-result-topic
      - PUBSUB_SECRET_TOKEN=local-internal-secret
    depends_on:
      - core
      - pubsub-emulator

  firestore-emulator:
    image: google/cloud-sdk:emulators
    ports:
      - "8081:8080"
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-project

  pubsub-init:
    image: google/cloud-sdk:emulators
    depends_on:
      - pubsub-emulator
      - core
    entrypoint: >
      bash -c "
        echo 'Waiting for PubSub emulator...';
        while ! curl -s http://pubsub-emulator:8085 > /dev/null; do sleep 1; done;
        echo 'Creating PubSub topics...';
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/build-context-topic;
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/context-ready-topic;
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/review-code-topic;
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/review-result-topic;
        echo 'Creating PubSub push subscriptions to Core...';
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/context-ready-sub \
          -H 'Content-Type: application/json' \
          -d '{\"topic\":\"projects/local-project/topics/context-ready-topic\",\"pushConfig\":{\"pushEndpoint\":\"http://core:8080/api/v1/internal/pubsub?token=local-internal-secret\"}}';
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/review-result-sub \
          -H 'Content-Type: application/json' \
          -d '{\"topic\":\"projects/local-project/topics/review-result-topic\",\"pushConfig\":{\"pushEndpoint\":\"http://core:8080/api/v1/internal/review-results?token=local-internal-secret\"}}';
        echo 'PubSub emulator initialized successfully.';
      "
